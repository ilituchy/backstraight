<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backstraight Capital Advisors</title>
<style>
  :root {
    --navy: #0f1d33;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --rule: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: #fbfbfa;
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 34rem; text-align: center; }
  .mark {
    font-size: .7rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2rem;
  }
  h1 {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: clamp(1.9rem, 5vw, 2.9rem);
    font-weight: 500;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--navy);
    margin: 0 0 1.25rem;
  }
  p { color: var(--muted); margin: 0 auto; max-width: 26rem; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem auto; width: 3rem; }
  .status {
    display: inline-block;
    margin-top: 2.5rem;
    padding: .4rem .8rem;
    border: 1px solid var(--rule);
    border-radius: 999px;
    font-size: .75rem;
    color: var(--muted);
    background: #fff;
  }
</style>
</head>
<body>
  <main>
    <div class="mark">Backstraight Capital Advisors</div>
    <h1>Hello world.</h1>
    <p>The deployment pipeline is live. Real content coming soon.</p>
    <hr>
    <span class="status">Deployed from <code>main</code> via GitHub Actions</span>
  </main>
</body>
</html>
